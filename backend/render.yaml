services:
  - type: web
    name: igreja-viagens-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAME_SITE
        value: none
      - key: BOOTSTRAP_ADMIN_ENABLED
        value: "true"
      - key: ADMIN_CPF
        sync: false
      - key: ADMIN_NAME
        value: Administrador
      - key: ADMIN_PASSWORD
        sync: false
