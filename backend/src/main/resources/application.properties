spring.application.name=viagens-igreja

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/igreja_viagens}
spring.datasource.username=${DB_USERNAME:igreja}
spring.datasource.password=${DB_PASSWORD:igreja}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

server.port=${PORT:8080}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:strict}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.tracking-modes=cookie

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.cpf=${ADMIN_CPF:10127544135}
app.bootstrap-admin.name=${ADMIN_NAME:Administrador}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}
